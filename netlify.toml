# This configuration preserves the historical datepicker documentation site.
# The hosted CodeRocket UI application is deployed from its separate private repository.
[build]
  base = "legacy/vue-tailwind-datepicker"
  command = "npm ci --prefix docs && npm run docs:build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "24"
  DOCS_BASE = "/"
