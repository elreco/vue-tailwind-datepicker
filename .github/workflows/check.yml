name: Check public core

on:
  push:
    branches: [main, codex/product-transition]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

# Publication is intentionally not automated. The historical datepicker release
# workflows are archived under legacy/, outside GitHub's active workflow directory.
