[build]
  command = "npm ci && npm run build"
  publish = "apps/site/dist"
[build.environment]
  NODE_VERSION = "24"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[redirects]]
  from = "/docs"
  to = "/docs/"
  status = 301
